apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: caoms-api-hpa, namespace: caoms }
spec: { scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: caoms-api }, minReplicas: 2, maxReplicas: 10, metrics: [{ type: Resource, resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } } }] }
