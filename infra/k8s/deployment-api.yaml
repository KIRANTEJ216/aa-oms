apiVersion: apps/v1
kind: Deployment
metadata: { name: caoms-api, namespace: caoms }
spec:
  replicas: 2
  selector: { matchLabels: { app: caoms-api } }
  template:
    metadata: { labels: { app: caoms-api } }
    spec:
      containers:
        - name: api
          image: gcr.io/caoms-dev/caoms-api:latest
          ports: [{ containerPort: 8000 }]
          env:
            - { name: GOOGLE_CLOUD_PROJECT, value: caoms-dev }
            - { name: FIRESTORE_LOCATION, value: asia-south1 }
            - { name: GCS_BUCKET, value: caoms-docs-prod }
            - { name: TENANT_MODE, value: single }
            - { name: JWT_SECRET, valueFrom: { secretKeyRef: { name: caoms-secrets, key: jwt-secret } } }
            - { name: REDIS_URL, valueFrom: { secretKeyRef: { name: caoms-secrets, key: redis-url } } }
          livenessProbe: { httpGet: { path: /health, port: 8000 }, initialDelaySeconds: 15, periodSeconds: 10 }
          readinessProbe: { httpGet: { path: /ready, port: 8000 }, initialDelaySeconds: 5, periodSeconds: 5 }
          resources: { requests: { cpu: 250m, memory: 512Mi }, limits: { cpu: 1000m, memory: 1Gi } }
