services:
  # ── Firestore emulator (asia-south1 in prod, emulator locally) ──────────
  firestore-emulator:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators
    command: gcloud emulators firestore start --host-port=0.0.0.0:8080 --project=caoms-dev
    ports:
      - "8080:8080"
      - "4000:4000" # emulator UI
    environment:
      - FIRESTORE_EMULATOR_HOST=firestore-emulator:8080

  # ── GCS emulator (fake-gcs) ─────────────────────────────────────────────
  gcs-emulator:
    image: fsouza/fake-gcs-server:latest
    command: -scheme http -port 4443 -public-host gcs-emulator:4443
    ports:
      - "4443:4443"
    volumes:
      - gcsdata:/data

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, retries: 5 }

  # ── n8n (workflows) ────────────────────────────────────────────────────
  n8n:
    image: n8nio/n8n:latest
    ports: ["5678:5678"]
    environment: { N8N_BASIC_AUTH_ACTIVE: "false", DB_TYPE: sqlite }
    volumes: [n8ndata:/home/node/.n8n]

  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    ports: ["8000:8000"]
    env_file: .env
    environment:
      - FIRESTORE_EMULATOR_HOST=firestore-emulator:8080
      - GCS_EMULATOR_HOST=http://gcs-emulator:4443
      - REDIS_URL=redis://redis:6379/0
      - TENANT_MODE=single
      - GOOGLE_CLOUD_PROJECT=caoms-dev
    depends_on:
      firestore-emulator: { condition: service_started }
      redis: { condition: service_healthy }
    volumes: ["./apps/api:/app"]
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  web:
    build: { context: ., dockerfile: infra/docker/Dockerfile.web }
    ports: ["3000:3000"]
    env_file: .env
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_TENANT_MODE=single
    depends_on: [api]
    volumes: ["./apps/web:/app/apps/web", "./packages/shared:/app/packages/shared"]

volumes: { gcsdata: {}, n8ndata: {} }
